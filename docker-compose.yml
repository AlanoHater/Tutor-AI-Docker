version: '3.8'
services:
  backend:
    build: ./backend
    container_name: tutor-backend
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./backend/database:/app/database
      - ./backend/uploads:/app/uploads
    env_file:
      - .env
  frontend:
    build: ./frontend
    container_name: tutor-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
